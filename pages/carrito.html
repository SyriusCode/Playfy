<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playfy</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/header.css">
    <link rel="stylesheet" href="../assets/css/footer.css">
    <link rel="stylesheet" href="../assets/css/pages/carrito.css">
</head>
<body>
    <!-- Header común -->
    <header id="site-header"></header>

    <main class="carrito-principal">
        <h1>Mi carrito</h1>

        <div class="carrito-contenido">
            <section class="carrito-productos">
                <h2>Mis juegos</h2>

                <div id="carrito-lista" class="carrito-lista"></div>

                <a href="catalogo.html" class="seguir-comprando">
                    Seguir comprando
                </a>
            </section>

            <!-- Resumen dell carrito -->
            <aside class="carrito-resumen">
                <h2>Resumen del carrito</h2>

                <div id="resumen-productos" class="resumen-productos"></div>

                <div class="resumen-total">
                    <span>Total:</span>
                    <span id="carrito-total">0,00 €</span>
                </div>

                <button type="button" id="finalizar-compra" class="btn-finalizar">
                    Finalizar compra
                </button>

                <p id="mensaje-compra" class="mensaje-compra" role="status"></p>
            </aside>
        </div>
    </main>

    <!-- Footer común -->
    <footer id="site-footer"></footer>

    <script type="module" src="../assets/js/main.js"></script>
    <script type="module" src="../assets/js/pages/carrito.js"></script>
</body>
</html>
