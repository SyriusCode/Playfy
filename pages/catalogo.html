<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playfy</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/header.css">
    <link rel="stylesheet" href="../assets/css/footer.css">
    <link rel="stylesheet" href="../assets/css/pages/catalogo.css">
</head>

<body>
    <!-- Header común -->
    <header id="site-header"></header>

    <main class="catalogo">
        <h1>Catálogo</h1>
        <div class="catalogo-contenido">

            <!-- Filtros -->

            <aside class="catalogo-filtros">
                <h2>Filtros</h2>

                <!-- Categorías -->
                <fieldset class="filtro-grupo">
                    <legend>Categorías</legend>
                    <label>
                        <input type="radio" name="categoria" value="todos" checked>
                        Todos
                    </label>
                    <label>
                        <input type="radio" name="categoria" value="accion">
                        Acción
                    </label>
                    <label>
                        <input type="radio" name="categoria" value="aventura">
                        Aventura
                    </label>
                    <label>
                        <input type="radio" name="categoria" value="deportes">
                        Deportes
                    </label>
                </fieldset>

                <!-- Plataforma -->
                <fieldset class="filtro-grupo">
                    <legend>Plataforma</legend>
                    <label>
                        <input type="radio" name="plataforma" value="todas" checked>
                        Todas
                    </label>
                    <label>
                        <input type="radio" name="plataforma" value="pc">
                        PC
                    </label>

                    <label>
                        <input type="radio" name="plataforma" value="ps5">
                        PlayStation 5
                    </label>
                    <label>
                        <input type="radio" name="plataforma" value="switch">
                        Nintendo Switch
                    </label>
                </fieldset>

                <!-- Precio -->
                <fieldset class="filtro-grupo">
                    <legend>Precio máximo</legend>
                    <div class="precio-valor">
                        Hasta <span id="precio-actual">100</span> €
                    </div>
                    <input type="range" id="filtro-precio" min="0" max="100" step="5" value="100">
                    <div class="precio-limites">
                        <span>0 €</span>
                        <span>100 €</span>
                    </div>
                </fieldset>
            </aside>



            <!-- JUEGOS -->
            <section class="catalogo-juegos">
                <div class="catalogo-grid" id="catalogo-grid">
                    <!-- JS -->
                </div>
                <nav class="paginacion" id="paginacion">
                    <!-- JS -->
                </nav>
            </section>
        </div>



    </main>

    <!-- Footer común -->
    <footer id="site-footer"></footer>

    <script type="module" src="../assets/js/main.js"></script>

    <!-- Scripts específicos del catálogo -->
    <script type="module" src="../assets/js/pages/catalogo.js"></script>
</body>

</html>
