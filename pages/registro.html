<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playfy</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/header.css">
    <link rel="stylesheet" href="../assets/css/footer.css">
    <link rel="stylesheet" href="../assets/css/pages/auth.css">
</head>

<body>
    <!-- Header común -->
    <header id="site-header"></header>

    <main class="auth">
        <div class="auth-card">
            <div class="auth-intro">
                <h1>Únete a Playfy</h1>
                <p>Regístrate para comenzar tu experiencia</p>
            </div>
            <form class="auth-form" id="auth-form">
                <div class="form-grupo">
                    <label for="username">Nombre de usuario</label>
                    <input type="username" id="username" name="username" placeholder="Introduce tu nombre de usuario" required>
                </div>

                <div class="form-grupo">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="form-grupo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="********" required>
                </div>

                <div class="form-grupo">
                    <label for="password-confirm">Confirmar contraseña</label>
                    <input type="password" id="password-confirm" name="password-confirm" placeholder="********" required>
                </div>
                <div class="auth-opcion">
                    <label class="checkbox">
                        <input type="checkbox" name="checkbox" required>
                        He leído y acepto los <a href="privacidad.html" class="politica-privacidad">Política de Privacidad</a>
                    </label>
                </div>

                <button type="submit" class="btn-auth">
                    Iniciar sesión
                </button>
            </form>

            <div class="auth-otra-opcion">
                ¿Ya tienes cuenta?
                <a href="registro.html">Inicia sesión</a>
            </div>
        </div>
    </main>

    <!-- Footer común -->
    <footer id="site-footer"></footer>

    <script type="module" src="../assets/js/main.js"></script>
</body>

</html>
